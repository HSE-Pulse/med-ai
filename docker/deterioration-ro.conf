worker_processes 1;
events { worker_connections 1024; }

http {
    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;

        # Read-only gate for the PUBLIC deterioration API. The service has no
        # auth of its own, and its write surface is not something to hand to
        # the internet: POST /reset wipes simulation state, /governance/config
        # toggles auto-acknowledgement, and /screen /escalate /acknowledge
        # mutate the clinical queue. Everything except GET/HEAD is refused.
        if ($request_method !~ ^(GET|HEAD)$) { return 403 '{"error":"read-only endpoint"}'; }

        # Light rate limit — public, unauthenticated, and the escalations
        # query fans out per-row work.
        limit_req zone=det burst=20 nodelay;

        location / {
            proxy_pass http://deterioration:8220;
        }
    }

    limit_req_zone $binary_remote_addr zone=det:10m rate=10r/s;
    default_type application/json;
}
