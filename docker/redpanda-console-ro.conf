worker_processes 1;
events { worker_connections 1024; }

http {
    map $http_upgrade $conn_upgrade { default upgrade; '' close; }

    server {
        listen 8080;

        # Shared proxy settings (inherited by all locations). WebSocket/SSE
        # support for live message streaming.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conn_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # Read-only gate for the PUBLIC console (OSS console has no RBAC):
        #  - DELETE/PUT/PATCH are always destructive  -> blocked everywhere.
        #  - Message browsing/search uses POST (a read) -> explicitly allowed.
        #  - All other POST (produce, create topic, delete records, schema/ACL
        #    writes) -> blocked by the GET-only default location.
        if ($request_method ~* "^(DELETE|PUT|PATCH)$") { return 403; }

        # Message search/browse — POST, but read-only. Allow it.
        location ~* ^/api/topics/[^/]+/messages$ {
            proxy_pass http://console:8080;
        }

        # Console v2.8+ moved reads to Connect-RPC (always POST). Allow only
        # Get*/List* methods — writes (PublishMessage, CreateTopic, Delete*,
        # ACL/transform mutations) stay blocked by the default location.
        location ~ ^/redpanda\.api\.[a-z0-9.]+\.[A-Za-z]+Service/(Get|List)[A-Za-z]*$ {
            proxy_pass http://console:8080;
        }

        # Everything else: safe read methods only.
        location / {
            limit_except GET HEAD OPTIONS { deny all; }
            proxy_pass http://console:8080;
        }
    }
}
