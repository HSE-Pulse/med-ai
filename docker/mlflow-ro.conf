worker_processes 1;
events { worker_connections 1024; }

http {
    server {
        listen 5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 50m;

        # Read-only gate for the PUBLIC MLflow tracking server (no native auth):
        #  - DELETE/PUT/PATCH blocked.
        #  - MLflow's mutating REST endpoints (create/delete/update/restore/log-*/
        #    set-tag/...) are POST -> blocked by path.
        #  - Reads (GET) and POST /...search/get-history stay allowed, so the UI
        #    fully works (browse experiments, runs, metric charts, artifacts).
        if ($request_method ~* "^(DELETE|PUT|PATCH)$") { return 403; }

        location ~* /(create|delete|update|restore|log-metric|log-parameter|log-batch|log-model|log-inputs|set-tag|delete-tag|set-experiment-tag|transition-stage|rename|finalize|gc)$ {
            return 403;
        }

        location / {
            proxy_pass http://mlflow:5000;
        }
    }
}
